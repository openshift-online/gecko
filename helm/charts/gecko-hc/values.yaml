replicaCount: 1

image:
  registry: us-docker.pkg.dev
  repository: gcp-hcp-commons/gcp-hcp-images/gecko-controllers
  tag: ""
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

orlopURL: ""
logLevel: info

pullSecret:
  storeName: gcp-secret-manager
  gcpKey: default-openshift-pull-secret

# Spanner-backed etcd through socketcd. When enabled, clusters selected as new are
# created with Unmanaged etcd and socketcd provisions the backend. HyperShift does
# not allow the etcd management type to change, so each cluster's choice is
# recorded and never changes when this value does. See controllers/README.md
# (hc-controller, Spanner-backed etcd) for the selection rule. Enable it in a
# rollout after the one that deploys this controller version, because older
# controller pods ignore the record. Requires socketcd on the management clusters.
spannerEtcd:
  enabled: false

# JSON-encoded customer-facing GCP resource labels (e.g., goog-partner-solution).
# Injected by ArgoCD from the cluster secret meta_customer_labels.
# Default to empty object if not provided.
customerLabels: "{}"
logFormat: json
workers: 10

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

strategy:
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
  type: RollingUpdate

podSecurityContext:
  fsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}
imagePullSecrets: []
