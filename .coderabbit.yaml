# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
inheritance: true

reviews:
  pre_merge_checks:
    docstrings:
      mode: "off"
  tools:
    # Run through make lint, which builds the required Go plugin.
    golangci-lint:
      enabled: false
  path_instructions:
  - path: "platform-api/api/**"
    instructions: |
      Ensure API changes follow api-conventions as layed out in the API-CONVENTIONS.md file in the platform-api folder.
      Post all violations of the api-conventions in the review.