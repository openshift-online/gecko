description: RoleBinding binds a user to a PlatformRole or namespace-scoped Role within
  a namespace.
properties:
  apiVersion:
    description: |-
      APIVersion defines the versioned schema of this representation of an object.
      Servers should convert recognized schemas to the latest internal value, and
      may reject unrecognized values.
      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
    type: string
  kind:
    description: |-
      Kind is a string value representing the REST resource this object represents.
      Servers may infer this from the endpoint the client submits requests to.
      Cannot be updated.
      In CamelCase.
      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
    type: string
  metadata:
    type: object
  spec:
    properties:
      condition:
        description: |-
          Condition is an optional Cedar expression evaluated against the
          request context (resource name, spec fields, etc.). When set, the
          binding only grants access when the condition evaluates to true.
        type: string
      roleRef:
        description: |-
          RoleRef references a PlatformRole (cluster-scoped) or a namespace-scoped Role.
          Follows the Kubernetes roleRef convention.
        properties:
          apiGroup:
            description: APIGroup is the API group of the role resource.
            type: string
          kind:
            description: 'Kind is the type of role being referenced: "PlatformRole"
              or "Role".'
            type: string
          name:
            description: Name is the name of the role.
            type: string
        required:
        - apiGroup
        - kind
        - name
        type: object
      subject:
        type: string
    required:
    - roleRef
    - subject
    type: object
type: object
