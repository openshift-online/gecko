replicaCount: 1

image:
  registry: us-docker.pkg.dev
  repository: gcp-hcp-commons/gcp-hcp-images/gecko-controllers
  tag: ""
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

orlopURL: ""
logLevel: info

pullSecret:
  storeName: gcp-secret-manager
  gcpKey: default-openshift-pull-secret

# Spanner-backed etcd through socketcd. When enabled, clusters that have no
# recorded backend and no HostedCluster yet are created with Unmanaged etcd and
# socketcd provisions the backend. HyperShift does not allow the etcd management
# type to change, so the controller records each cluster's backend in a private
# annotation and never changes a recorded choice when this value changes: clusters
# created while it was enabled keep Spanner-backed etcd after it is disabled, and a
# cluster whose HostedCluster already exists is recorded as Managed when it is
# enabled. While it is disabled no backend is selected or recorded and a cluster
# without a record uses Managed etcd. A record is only ever corrected to match the
# etcd type of the cluster's live HostedCluster. Requires socketcd on the
# management clusters.
spannerEtcd:
  enabled: false

# JSON-encoded customer-facing GCP resource labels (e.g., goog-partner-solution).
# Injected by ArgoCD from the cluster secret meta_customer_labels.
# Default to empty object if not provided.
customerLabels: "{}"
logFormat: json
workers: 10

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

strategy:
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
  type: RollingUpdate

podSecurityContext:
  fsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}
imagePullSecrets: []
