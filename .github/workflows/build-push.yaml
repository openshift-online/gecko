name: Build and Push

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Test orlop
        working-directory: orlop
        run: go test ./...

      - name: Test platform-api
        working-directory: platform-api
        run: go test ./...

      - name: Test controllers
        working-directory: controllers
        run: go test ./...

  build-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push platform-api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: quay.io/gcphcp/gecko:${{ steps.vars.outputs.short_sha }}

      - name: Build and push controllers image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: controllers/Dockerfile
          push: true
          tags: quay.io/gcphcp/gecko-controllers:${{ steps.vars.outputs.short_sha }}
